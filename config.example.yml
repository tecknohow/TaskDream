database:
  # sqlite or postgres
  type: sqlite
  # SQLite file path (only for sqlite)
  path: ./taskdream.db
  # PostgreSQL settings (only for postgres)
  host: localhost
  port: 5432
  user: taskdream
  password: changeme
  name: taskdream
  sslmode: disable
  maxopenconns: 100
  maxidleconns: 50

server:
  port: 3456
  frontendurl: http://localhost:5173
  # Set to frontend/dist in production when serving embedded frontend
  # staticpath: ./frontend/dist

auth:
  jwtsecret: change-me-to-a-long-random-string
  tokenexpiry: 72h

cors:
  enable: true
  origins:
    - http://localhost:5173
    - http://localhost:3456
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS

log:
  level: info
  # file, stdout
  output: stdout
