version: '3.8'

services:
  taskdream:
    build: .
    container_name: taskdream
    ports:
      - '3456:3456'
    environment:
      TASKDREAM_DATABASE_TYPE: sqlite
      TASKDREAM_DATABASE_PATH: /app/data/taskdream.db
      TASKDREAM_AUTH_JWTSECRET: change-me-to-a-random-secret
      TASKDREAM_SERVER_PORT: 3456
    volumes:
      - taskdream-data:/app/data
    restart: unless-stopped

  # Uncomment below for PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: taskdream
  #     POSTGRES_USER: taskdream
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  taskdream-data:
  # postgres-data:
